<!DOCTYPE html>
<div id="container"></div>
<h2 id="q"></h2>
<p id="err" style="color:red"></p>
<div id="fig"></div>
<input id="a" type="number">
<button id="back">Back</button>
<button id="next">Next</button>
<script type="module">

    // TO DO:
    //have next change to finish when its quesiton 60
    // end screen - thank you for participating
    //styling
    //master csv file
    // unique participant ID

    import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";
    console.log(d3);

    import { bubbleGraph } from './graphs.js';
    import { stackedBarGraph } from './graphs.js';
    import { radarGraph } from './graphs.js';

    const participantId = 2;
    const graphs = [bubbleGraph, stackedBarGraph, radarGraph];

    const trials = graphs.flatMap(graph =>
        Array.from({length: 2}, () => ({ //change back to 20; changed to 2 for testing
            graph,
            pct: Math.floor(Math.random() * 91) + 5,
            answer: ""
        }))
    );

    //shuffle questions/graph types
    for (let k = trials.length - 1; k > 0; k--) {
        const j = Math.floor(Math.random() * (k + 1));
        [trials[k], trials[j]] = [trials[j], trials[k]];
    }

    
    const q = document.getElementById("q");
    const fig = document.getElementById("fig");
    const a = document.getElementById("a");
    const err = document.getElementById("err");
    let i = 0;

    // Show chart and question
    function show() {
        const t = trials[i];
        q.textContent = `Question ${i + 1} of ${trials.length}: What percent of the larger is the smaller?`;
        fig.replaceChildren(t.graph(t.pct, d3));
        a.value = t.answer;
        err.textContent="";
        a.focus();
    }

    // locally save csv file
    function downloadCSV() {
        const header = ["ParticipantID", "TrialNum", "Vis", "TruePercent", "ReportedPercent"];
        const rows = trials.map((t, idx) => [
            participantId,
            idx + 1,
            t.graph.name,
            t.pct,
            t.answer
        ]);

        const csv = [header, ...rows].map(r=> r.join(",")).join("\n");
        const url = URL.createObjectURL(new Blob([csv], {type: "text/csv"}));
        const link = document.createElement("a");
        link.href = url;
        link.download = `${participantId}.csv`;
        link.click();
        URL.revokeObjectURL(url);
    }

    //buttons
    document.getElementById("back").onclick = () => {
        trials[i].answer = a.value;
        if (i>0){i--; show();}
    };

    document.getElementById("next").onclick = () => {
        if (a.value === "") { err.textContent = "Enter a number."; return; }
        trials[i].answer = a.value;
        if (i < trials.length - 1){ i++; show();}
        else{
            downloadCSV();
        }
    };

    a.addEventListener("keydown", e => {
        if (e.key === "Enter") document.getElementById("next").click();
    });

    show();

</script>
